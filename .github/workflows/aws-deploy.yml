name: deploy

# Two steps, because they are two different things and only the first is
# Terraform's. `terraform apply` converges the AWS resources; it does not put new
# code on a running instance, because bootstrap.sh is user_data with
# `user_data_replace_on_change = false` and so runs once per launch. Replacing the
# instance on every push would destroy the data volume's backfill, which is the
# expensive part. So the second step sends deploy/aws/bin/deploy.sh over SSM — the same
# channel that exists because there is no key pair and no open port 22.
# After the image of the commit is published: the node runs it.
on:
  workflow_run:
    workflows: [image]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # The OIDC token this job trades for AWS credentials. Without it the exchange
  # fails with a token-not-available error that says nothing about permissions.
  id-token: write

jobs:
  # The approval is its own job so that only the newest commit waits for it. A
  # run waiting for review holds its concurrency group; with the review inside
  # the deploy job, that kept an old commit at the head of the queue and made a
  # newer one wait behind it. Here a newer push cancels the older wait, which is
  # safe because nothing has run yet.
  approve:
    # Until an account is configured there is nothing to deploy to, and a red
    # main would be reporting the absence of a bucket as a broken build. Setting
    # both variables is what turns this on; gating on both means a half-finished
    # setup skips rather than failing somewhere in the middle.
    if: vars.TF_STATE_BUCKET != '' && vars.AWS_ROLE_ARN != '' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # Set this environment up with a required reviewer to gate what reaches AWS.
    environment: aws
    concurrency:
      group: deploy-approval
      cancel-in-progress: true
    steps:
      - run: echo "approved ${{ github.event.workflow_run.head_sha || github.sha }}"

  deploy:
    needs: approve
    runs-on: ubuntu-latest
    # One deploy at a time, and never cancelled half way: an interrupted apply
    # leaves state and reality disagreeing, and an interrupted deploy leaves a
    # node between two commits. A newer approved commit still replaces one that
    # is only pending here, so the queue never holds more than the latest.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      # One source for the region, with the same default main.tf carries, so
      # leaving the variable unset gets the documented region rather than an
      # empty -var that fails after the credentials step has already run.
      # It has to agree with aws:RequestedRegion in deploy/aws/deployer-policy.json.
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      # No access key anywhere, in this repository or in its settings. The job
      # presents the OIDC token GitHub mints for it and gets credentials that
      # expire with the run, which is why deploy/aws/github-oidc-trust.json pins the
      # repository by numeric id: a token from anywhere else does not match.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4

      - name: init
        working-directory: deploy/aws
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION"

      - name: plan
        working-directory: deploy/aws
        run: |
          terraform plan -input=false -out=tfplan \
            -var "region=$AWS_REGION"

      # The point of this project is that its numbers can be checked, so the
      # plan goes where anyone can read it rather than only into the log of a job
      # they would have to go looking for. Nothing here is secret: it is a diff
      # of resource attributes, and the only address in it is published on
      # purpose. This is also the answer to wanting a public state file without
      # a public bucket — the plan is the readable part, and the state is not.
      - name: publish the plan
        working-directory: deploy/aws
        run: |
          {
            echo '## terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: apply
        working-directory: deploy/aws
        run: terraform apply -input=false -auto-approve tfplan

      - name: id of the instance to deploy to
        id: target
        working-directory: deploy/aws
        run: echo "instance=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"

      # Only that a command can be sent at all. The agent reports Online long
      # before bootstrap.sh has finished, so this is not what makes a first deploy
      # safe — the marker wait in the next step is.
      - name: wait for the node to accept commands
        run: |
          for _ in $(seq 1 60); do
            state=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.target.outputs.instance }}" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)
            [ "$state" = "Online" ] && break
            sleep 10
          done
          test "$state" = "Online"

      # On a brand-new instance bootstrap.sh is still installing ClickHouse and
      # applying the schema, and this script applies the schema too: both at once
      # is two writers to one database. bootstrap.sh ends by writing the marker,
      # so waiting for it is what makes a first deploy safe — and it is also why
      # the script being absent is not an error here, since the bootstrap this
      # waits for is what clones it.
      # The commit whose image was just published, named exactly: main may have
      # moved since, to a commit whose image does not exist yet.
      - name: send the deploy
        id: send
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          id=$(aws ssm send-command \
            --instance-ids "${{ steps.target.outputs.instance }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${COMMIT::7}" \
            --timeout-seconds 3600 \
            --parameters commands='["for _ in $(seq 1 120); do [ -f /var/log/stride-bootstrap.done ] && break; sleep 10; done; test -f /var/log/stride-bootstrap.done || { echo \"bootstrap never finished\" >&2; exit 1; }; COMMIT='"$COMMIT"' /opt/stride-lite/deploy/aws/bin/deploy.sh"]' \
            --query 'Command.CommandId' --output text)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # send-command returns as soon as the command is queued, so the run would go
      # green on a deploy that failed. This is what makes the result mean something.
      - name: wait for it, and fail on its exit code
        run: |
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation \
              --command-id "${{ steps.send.outputs.id }}" \
              --instance-id "${{ steps.target.outputs.instance }}" \
              --query Status --output text)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 20
          done
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.id }}" \
            --instance-id "${{ steps.target.outputs.instance }}" \
            --query 'StandardOutputContent' --output text
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.id }}" \
            --instance-id "${{ steps.target.outputs.instance }}" \
            --query 'StandardErrorContent' --output text >&2
          test "$status" = Success

      # api_origin_url and not api_url: with api_domain set, api_url is a name in
      # somebody else's DNS zone and it resolves when they add the record, which
      # is not a condition of this deploy. The distribution's own name is.
      - name: the API answers
        working-directory: deploy/aws
        run: |
          url=$(terraform output -raw api_origin_url)
          for _ in $(seq 1 30); do
            curl -fsS "$url/healthz" && break
            sleep 10
          done
          curl -fsS "$url/healthz"

      # A first load runs for hours and deliberately does not block a deploy, so
      # the one thing this workflow owes the operator is to say where it got to
      # rather than leaving them to go and look. Not a gate: a node still loading
      # history is a working deploy, and that is the whole design.
      - name: what the node holds
        run: |
          id=$(aws ssm send-command \
            --instance-ids "${{ steps.target.outputs.instance }}" \
            --document-name AWS-RunShellScript \
            --comment "first-load status" \
            --timeout-seconds 600 \
            --parameters commands='["systemctl is-active stride-first-load || true","cat /var/lib/clickhouse/first-load.state 2>/dev/null || echo \"no first-load state yet\"","curl -fsS http://127.0.0.1/status"]' \
            --query 'Command.CommandId' --output text)
          for _ in $(seq 1 30); do
            status=$(aws ssm get-command-invocation --command-id "$id" \
              --instance-id "${{ steps.target.outputs.instance }}" \
              --query Status --output text)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$id" \
            --instance-id "${{ steps.target.outputs.instance }}" \
            --query 'StandardOutputContent' --output text | tee -a "$GITHUB_STEP_SUMMARY"
