name: deploy

# Two steps, because they are two different things and only the first is
# Terraform's. `terraform apply` converges the AWS resources; it does not put new
# code on a running instance, because bootstrap.sh is user_data with
# `user_data_replace_on_change = false` and so runs once per launch. Replacing the
# instance on every push would destroy the data volume's backfill, which is the
# expensive part. So the second step sends scripts/deploy.sh over SSM — the same
# channel that exists because there is no key pair and no open port 22.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancelled half way: an interrupted apply leaves
# state and reality disagreeing, and an interrupted deploy leaves a node between
# two commits.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  # The OIDC token this job trades for AWS credentials. Without it the exchange
  # fails with a token-not-available error that says nothing about permissions.
  id-token: write

jobs:
  deploy:
    # Until an account is configured there is nothing to deploy to, and a red
    # main would be reporting the absence of a bucket as a broken build. Setting
    # both variables is what turns this on; gating on both means a half-finished
    # setup skips rather than failing somewhere in the middle.
    if: vars.TF_STATE_BUCKET != '' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # Set this environment up with a required reviewer to gate what reaches AWS.
    environment: aws
    env:
      # One source for the region, with the same default main.tf carries, so
      # leaving the variable unset gets the documented region rather than an
      # empty -var that fails after the credentials step has already run.
      # It has to agree with aws:RequestedRegion in infra/deployer-policy.json.
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      # No access key anywhere, in this repository or in its settings. The job
      # presents the OIDC token GitHub mints for it and gets credentials that
      # expire with the run, which is why infra/github-oidc-trust.json pins the
      # repository by numeric id: a token from anywhere else does not match.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4

      - name: init
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION"

      - name: plan
        working-directory: infra
        run: |
          terraform plan -input=false -out=tfplan \
            -var "region=$AWS_REGION"

      # The point of this project is that its numbers can be checked, so the
      # plan goes where anyone can read it rather than only into the log of a job
      # they would have to go looking for. Nothing here is secret: it is a diff
      # of resource attributes, and the only address in it is published on
      # purpose. This is also the answer to wanting a public state file without
      # a public bucket — the plan is the readable part, and the state is not.
      - name: publish the plan
        working-directory: infra
        run: |
          {
            echo '## terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan

      - name: id of the instance to deploy to
        id: target
        working-directory: infra
        run: echo "instance=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"

      # Only that a command can be sent at all. The agent reports Online long
      # before bootstrap.sh has finished, so this is not what makes a first deploy
      # safe — the marker wait in the next step is.
      - name: wait for the node to accept commands
        run: |
          for _ in $(seq 1 60); do
            state=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.target.outputs.instance }}" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)
            [ "$state" = "Online" ] && break
            sleep 10
          done
          test "$state" = "Online"

      # On a brand-new instance bootstrap.sh is still installing ClickHouse and
      # applying the schema, and this script applies the schema too: both at once
      # is two writers to one database. bootstrap.sh ends by writing the marker,
      # so waiting for it is what makes a first deploy safe — and it is also why
      # the script being absent is not an error here, since the bootstrap this
      # waits for is what clones it.
      - name: send the deploy
        id: send
        run: |
          id=$(aws ssm send-command \
            --instance-ids "${{ steps.target.outputs.instance }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 3600 \
            --parameters commands='["for _ in $(seq 1 120); do [ -f /var/log/stride-bootstrap.done ] && break; sleep 10; done; test -f /var/log/stride-bootstrap.done || { echo \"bootstrap never finished\" >&2; exit 1; }; BRANCH=main /opt/stride-lite/scripts/deploy.sh"]' \
            --query 'Command.CommandId' --output text)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # send-command returns as soon as the command is queued, so the run would go
      # green on a deploy that failed. This is what makes the result mean something.
      - name: wait for it, and fail on its exit code
        run: |
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation \
              --command-id "${{ steps.send.outputs.id }}" \
              --instance-id "${{ steps.target.outputs.instance }}" \
              --query Status --output text)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 20
          done
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.id }}" \
            --instance-id "${{ steps.target.outputs.instance }}" \
            --query 'StandardOutputContent' --output text
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.id }}" \
            --instance-id "${{ steps.target.outputs.instance }}" \
            --query 'StandardErrorContent' --output text >&2
          test "$status" = Success

      - name: the API answers
        working-directory: infra
        run: |
          url=$(terraform output -raw api_url)
          for _ in $(seq 1 30); do
            curl -fsS "$url/healthz" && break
            sleep 10
          done
          curl -fsS "$url/healthz"
