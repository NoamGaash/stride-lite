name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Drift between this API and production is what actually breaks a migration
    # that runs for weeks, and a single PR never reveals it. Hence nightly.
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/sql.test.ts

  schema:
    # The schema has to apply to a clean ClickHouse, which is cheap to prove and
    # the thing most likely to rot silently as the DDL is edited.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start ClickHouse
        run: |
          curl -s https://clickhouse.com/ | sh
          ./clickhouse server --daemon
          for _ in $(seq 30); do ./clickhouse client --query 'SELECT 1' && break; sleep 2; done
      - name: Apply the schema
        env:
          CH_CLIENT: ./clickhouse client
        run: ./scripts/apply-schema.sh
      - name: Expect the 16 tables, the aggregation table and its refresh, and the migration record
        run: |
          n=$(./clickhouse client --query "SELECT count() FROM system.tables WHERE database='stride'")
          test "$n" = 19 || { echo "got $n tables, want 19"; exit 1; }

      - name: Expect apply-schema to be idempotent
        run: ./scripts/apply-schema.sh
        env:
          CH_CLIENT: ./clickhouse client

      - name: Apply the raw landing table
        run: ./clickhouse client --database stride --multiquery < db/raw.sql

      - name: Apply the continuous ingest
        run: ./clickhouse client --database stride --multiquery < ingest/siri.sql

      - name: Apply the enrichment
        run: ./clickhouse client --database stride --multiquery < ingest/enrich.sql

      - name: Expect the whole chain to be registered and healthy
        run: |
          n=$(./clickhouse client --query "SELECT count() FROM system.view_refreshes WHERE database='stride'")
          test "$n" = 9 || { echo "got $n refreshable views, want 9"; exit 1; }
          bad=$(./clickhouse client --query "SELECT count() FROM system.view_refreshes WHERE database='stride' AND exception != ''")
          test "$bad" = 0 || {
            ./clickhouse client --query "SELECT view, exception FROM system.view_refreshes WHERE exception != '' FORMAT Vertical"
            exit 1
          }

      - name: Apply the GTFS staging schema
        run: ./clickhouse client --database stride --multiquery < ingest/gtfs-staging.sql

      - name: Apply the projections
        # They are 30% of the footprint and the difference between 44 s and
        # 0.016 s on two endpoints, so a projection that stops applying is a
        # silent regression rather than an error.
        run: ./clickhouse client --database stride --multiquery < db/projections.sql

      - name: Expect every projection to be registered
        run: |
          n=$(./clickhouse client --query "SELECT count() FROM system.projections WHERE database='stride'")
          test "$n" = 4 || { echo "got $n projections, want 4"; exit 1; }

      # The ingest views refresh a minute after they are created and then every
      # minute, and they really do fetch from S3, so by this point the landing
      # table may hold an hour of live snapshots. This test is about the
      # enrichment and not about them: stop them and clear what they brought, or
      # the assertion below passes or fails on how long the steps above took.
      - name: Expect the enrichment to be idempotent on an empty feed
        run: |
          ./clickhouse client --query "SYSTEM STOP VIEW stride.siri_ingest_current"
          ./clickhouse client --query "SYSTEM STOP VIEW stride.siri_ingest_previous"
          ./clickhouse client --query "TRUNCATE TABLE stride.siri_vehicle_location_raw"
          ./clickhouse client --query "TRUNCATE TABLE stride.siri_vehicle_location"
          ./clickhouse client --database stride --multiquery < ingest/enrich-once.sql
          n=$(./clickhouse client --query "SELECT count() FROM stride.siri_vehicle_location")
          test "$n" = 0 || { echo "enrichment invented $n rows from an empty feed"; exit 1; }

      # A deploy applies these files to a database that already exists, and under
      # CREATE ... IF NOT EXISTS a changed view body is accepted and discarded —
      # measured, and it is how gtfs_rides_agg_by_hour sat frozen at the dump's
      # last day while the suite stayed green. So assert the thing that was wrong:
      # applying a changed body changes the database.
      - name: Expect a changed view body to reach the database
        run: |
          interval() {
            ./clickhouse client --query "
              SELECT extract(create_table_query, 'REFRESH EVERY [0-9]+ [A-Z]+')
              FROM system.tables
              WHERE database='stride' AND name='gtfs_rides_agg_by_hour_refresh'"
          }
          before=$(interval)
          sed 's/REFRESH EVERY 6 HOUR/REFRESH EVERY 7 HOUR/' db/views.sql \
            | ./clickhouse client --database stride --multiquery
          after=$(interval)
          test "$after" = "REFRESH EVERY 7 HOUR" || {
            echo "view body did not converge: was '$before', applied 7 HOUR, got '$after'"
            exit 1
          }
          ./clickhouse client --database stride --multiquery < db/views.sql
          test "$(interval)" = "$before" || { echo "did not restore"; exit 1; }

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      # terraform validate does not look at the IAM policy, and IAM accepts an
      # action name it does not define, so a typo there is a permission that is
      # silently missing until an apply fails on it.
      - name: Expect every IAM action in the deployer policy to exist
        working-directory: .
        run: python3 scripts/check-iam-actions.py infra/deployer-policy.json infra/github-oidc-trust.json

  differential:
    # Compares endpoints against the live production API, which is a non-profit's
    # production service. Never on push: only on the nightly schedule or on
    # demand, with requests spaced out.
    #
    # Covers all 27 endpoints, and a coverage test fails if the published spec
    # grows one this suite does not exercise.
    #
    # Still disabled, and only for want of data: loading the 154 GB dump in CI is
    # not viable, so this needs a trimmed ClickHouse snapshot of the comparison
    # window published somewhere the runner can reach. That window is bounded at
    # both ends — 2025-01-01, where production's retention starts, to
    # 2026-05-29, where the dump's data ends. See docs/FINDINGS.md.
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm start &
      - run: npx wait-on http://127.0.0.1:8080/healthz --timeout 60000
      - run: npx vitest run tests/differential.test.ts
        env:
          DIFF_DELAY_MS: '800'
