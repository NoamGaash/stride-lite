name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Drift between this API and production is what actually breaks a migration
    # that runs for weeks, and a single PR never reveals it. Hence nightly.
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/sql.test.ts tests/registry.test.ts tests/status.test.ts tests/ops.test.ts

  api-e2e:
    # The API against a real database: tests/api/fixture.sh loads one hour of
    # Pi Day 2025 from files in the repository, and every tests/api/*.hurl runs
    # against it. Nothing here reaches Hasadna's bucket or production.
    runs-on: ubuntu-latest
    env:
      HURL_VERSION: 8.1.0
      HURL_SHA256: b497e7ab328100c507f1f3323ebe7cc5990d831ae4f9473b74d40b02971da4ca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Start ClickHouse
        run: |
          curl -s https://clickhouse.com/ | sh
          ./clickhouse server --daemon
          for _ in $(seq 30); do ./clickhouse client --query 'SELECT 1' && break; sleep 2; done
      - name: Load the fixture
        env:
          CH_CLIENT: ./clickhouse client
        run: tests/api/fixture.sh load
      - name: Install Hurl
        run: |
          f=hurl-$HURL_VERSION-x86_64-unknown-linux-gnu
          curl -sSfLO https://github.com/Orange-OpenSource/hurl/releases/download/$HURL_VERSION/$f.tar.gz
          echo "$HURL_SHA256  $f.tar.gz" | sha256sum -c
          tar xzf $f.tar.gz
          echo "$PWD/$f/bin" >> "$GITHUB_PATH"
      - name: Start the API
        working-directory: api
        run: |
          npm ci
          CH_DB=stride_test PORT=8080 npm start &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
      - run: hurl --test --jobs 1 --variable api=http://127.0.0.1:8080 tests/api

  load-from-dump:
    # The first load streams for hours, and its failures are timeouts that a
    # sample dump loaded in a second never reaches. This one is slowed down and
    # run as a user whose server-side timeouts are seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start ClickHouse
        run: |
          curl -s https://clickhouse.com/ | sh
          ./clickhouse server --daemon
          for _ in $(seq 30); do ./clickhouse client --query 'SELECT 1' && break; sleep 2; done
      - name: Load a slow dump
        env:
          CH_CLIENT: ./clickhouse client
        run: tests/load-from-dump.sh
      - name: GTFS loads whichever recent days are missing, today included
        env:
          CH_CLIENT: ./clickhouse client
        run: tests/gtfs-days.sh

  schema:
    # The schema has to apply to a clean ClickHouse, which is cheap to prove and
    # the thing most likely to rot silently as the DDL is edited.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start ClickHouse
        run: |
          curl -s https://clickhouse.com/ | sh
          ./clickhouse server --daemon
          for _ in $(seq 30); do ./clickhouse client --query 'SELECT 1' && break; sleep 2; done
      - name: Apply the schema
        env:
          CH_CLIENT: ./clickhouse client
        run: ./scripts/apply-schema.sh
      - name: Expect the 16 tables, siri_ride_duration, siri_ride_gtfs, backfill_progress, the landing table, the aggregation table and its refresh, and the migration record
        run: |
          n=$(./clickhouse client --query "SELECT count() FROM system.tables WHERE database='stride'")
          test "$n" = 24 || { echo "got $n tables, want 24"; exit 1; }

      - name: Expect apply-schema to be idempotent
        run: ./scripts/apply-schema.sh
        env:
          CH_CLIENT: ./clickhouse client

      - name: Apply the continuous ingest
        run: ./clickhouse client --database stride --multiquery < ingest/siri.sql

      - name: Apply the enrichment
        run: |
          for f in enrich gtfs-link duration-history; do
            ./clickhouse client --database stride --multiquery < "ingest/$f.sql"
          done

      # ingest/enrich-once.sql ends by writing ingest_day_health from
      # ingest_day_health_src, which this file creates, so the step below that
      # runs enrich-once fails with UNKNOWN_FUNCTION without it. infra/bootstrap.sh
      # installs it through scripts/first-load.sh and scripts/deploy.sh applies it
      # on every deploy, so a CI that skips it is testing a chain nothing deploys.
      - name: Apply the per-day health table and its refresh
        run: ./clickhouse client --database stride --multiquery < ingest/health.sql

      - name: Expect the whole chain to be registered and healthy
        run: |
          n=$(./clickhouse client --query "SELECT count() FROM system.view_refreshes WHERE database='stride'")
          test "$n" = 14 || { echo "got $n refreshable views, want 14"; exit 1; }
          bad=$(./clickhouse client --query "SELECT count() FROM system.view_refreshes WHERE database='stride' AND exception != ''")
          test "$bad" = 0 || {
            ./clickhouse client --query "SELECT view, exception FROM system.view_refreshes WHERE exception != '' FORMAT Vertical"
            exit 1
          }

      - name: Apply the GTFS staging schema
        run: ./clickhouse client --database stride --multiquery < ingest/gtfs-staging.sql

      # They are 30% of the footprint and the difference between 44 s and
      # 0.016 s on two endpoints, so a projection that stops applying is a
      # silent regression rather than an error. apply-schema.sh declares them;
      # this is the assertion that it did.
      - name: Expect every projection to be registered
        run: |
          n=$(./clickhouse client --query "SELECT count() FROM system.projections WHERE database='stride'")
          test "$n" = 4 || { echo "got $n projections, want 4"; exit 1; }

      # The expensive half of a projection is filling it, and MATERIALIZE
      # rewrites every active part whether or not the projection is already
      # complete — measured on 26.10. So apply-schema.sh issues MATERIALIZE
      # only for a pair some part is missing, and on a database whose parts all
      # carry their projections it must issue none. Asserted because the failure
      # is invisible: a deploy that silently rebuilds 74 GiB still succeeds.
      - name: Expect no projection to be re-materialised once it is complete
        run: |
          ./clickhouse client --query "
            INSERT INTO stride.gtfs_ride_stop (id, gtfs_ride_id)
            SELECT number, number FROM numbers(100000)"
          ./scripts/apply-schema.sh
          n=$(./clickhouse client --query "
            SELECT count() FROM system.mutations
            WHERE database = 'stride' AND command LIKE '%MATERIALIZE PROJECTION%'")
          test "$n" = 0 || {
            ./clickhouse client --query "
              SELECT table, command FROM system.mutations WHERE database = 'stride' FORMAT Vertical"
            echo "apply-schema re-materialised $n projection(s) that were already complete"
            exit 1
          }
          ./clickhouse client --query "TRUNCATE TABLE stride.gtfs_ride_stop"
        env:
          CH_CLIENT: ./clickhouse client

      # MATERIALIZE runs for hours on the real tables, and until it ends its parts
      # still look unfilled. A deploy in those hours must not queue a second one.
      # STOP MERGES holds the first mutation unfinished, as a long one would be.
      - name: Expect no second MATERIALIZE while the first is still running
        run: |
          export CH_DB=inflight
          PROJECTIONS=0 ./scripts/apply-schema.sh
          ./clickhouse client --query "
            INSERT INTO inflight.gtfs_ride_stop (id, gtfs_ride_id)
            SELECT number, number FROM numbers(100000)"
          ./clickhouse client --query "SYSTEM STOP MERGES inflight.gtfs_ride_stop"
          ./scripts/apply-schema.sh
          ./scripts/apply-schema.sh
          n=$(./clickhouse client --query "
            SELECT count() FROM system.mutations
            WHERE database = 'inflight' AND command LIKE '%MATERIALIZE PROJECTION%by_ride%'")
          ./clickhouse client --query "DROP DATABASE inflight"
          test "$n" = 1 || { echo "got $n MATERIALIZE mutations for by_ride, want 1"; exit 1; }
        env:
          CH_CLIENT: ./clickhouse client

      # The guard that keeps a first load from emptying a database somebody
      # else's data is in. It is the one failure mode of scripts/first-load.sh
      # that destroys rather than delays.
      - name: Expect first-load to refuse a database it has no record of loading
        run: |
          # siri_snapshot_id is not optional here even though the column is
          # Nullable: siri_snapshot_enriched_mv reads it as Int32.
          ./clickhouse client --query "
            INSERT INTO stride.siri_vehicle_location (id, siri_snapshot_id, recorded_at_time)
            SELECT 1, 1, now()"
          if FIRST_LOAD_STATE=$PWD/first-load.state \
             FIRST_LOAD_LOCK=$PWD/first-load.lock \
             ./scripts/first-load.sh; then
            echo "first-load.sh ran against a populated database with no state file"
            exit 1
          fi
          ./clickhouse client --query "TRUNCATE TABLE stride.siri_vehicle_location"
        env:
          CH_CLIENT: ./clickhouse client

      # The ingest views refresh a minute after they are created and then every
      # minute, and they really do fetch from S3, so by this point the landing
      # table may hold an hour of live snapshots. This test is about the
      # enrichment and not about them: stop them and clear what they brought, or
      # the assertion below passes or fails on how long the steps above took.
      - name: Expect the enrichment to be idempotent on an empty feed
        run: |
          ./clickhouse client --query "SYSTEM STOP VIEW stride.siri_ingest_current"
          ./clickhouse client --query "SYSTEM STOP VIEW stride.siri_ingest_previous"
          ./clickhouse client --query "TRUNCATE TABLE stride.siri_vehicle_location_raw"
          ./clickhouse client --query "TRUNCATE TABLE stride.siri_vehicle_location"
          ./clickhouse client --database stride --multiquery \
            --param_day="$(date -u +%F)" < ingest/enrich-once.sql
          n=$(./clickhouse client --query "SELECT count() FROM stride.siri_vehicle_location")
          test "$n" = 0 || { echo "enrichment invented $n rows from an empty feed"; exit 1; }

      # A deploy applies these files to a database that already exists, and under
      # CREATE ... IF NOT EXISTS a changed view body is accepted and discarded —
      # measured, and it is how gtfs_rides_agg_by_hour sat frozen at the dump's
      # last day while the suite stayed green. So assert the thing that was wrong:
      # applying a changed body changes the database.
      - name: Expect a changed view body to reach the database
        run: |
          interval() {
            ./clickhouse client --query "
              SELECT extract(create_table_query, 'REFRESH EVERY [0-9]+ [A-Z]+')
              FROM system.tables
              WHERE database='stride' AND name='gtfs_rides_agg_by_hour_refresh'"
          }
          before=$(interval)
          sed 's/REFRESH EVERY 6 HOUR/REFRESH EVERY 7 HOUR/' db/views.sql \
            | ./clickhouse client --database stride --multiquery
          after=$(interval)
          test "$after" = "REFRESH EVERY 7 HOUR" || {
            echo "view body did not converge: was '$before', applied 7 HOUR, got '$after'"
            exit 1
          }
          ./clickhouse client --database stride --multiquery < db/views.sql
          test "$(interval)" = "$before" || { echo "did not restore"; exit 1; }

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test
      # terraform validate does not look at the IAM policy, and IAM accepts an
      # action name it does not define, so a typo there is a permission that is
      # silently missing until an apply fails on it.
      - name: Expect every IAM action in the deployer policy to exist
        working-directory: .
        run: python3 scripts/check-iam-actions.py infra/deployer-policy.json infra/github-oidc-trust.json
      - name: Node config follows the repository on every deploy
        working-directory: .
        run: tests/install-node-config.sh

  differential:
    # Compares endpoints against the live production API, which is a non-profit's
    # production service. Never on push: only on the nightly schedule or on
    # demand, with requests spaced out.
    #
    # Covers all 27 endpoints, and a coverage test fails if the published spec
    # grows one this suite does not exercise.
    #
    # Still disabled, and only for want of data: loading the 154 GB dump in CI is
    # not viable, so this needs a trimmed ClickHouse snapshot of the comparison
    # window published somewhere the runner can reach. That window is bounded at
    # both ends — 2025-01-01, where production's retention starts, to
    # 2026-05-29, where the dump's data ends. See docs/FINDINGS.md.
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm start &
      - run: npx wait-on http://127.0.0.1:8080/healthz --timeout 60000
      - run: npx vitest run tests/differential.test.ts
        env:
          DIFF_DELAY_MS: '800'
      # Needs the same loaded database and nothing from production, so it waits
      # on the same snapshot this job waits on.
      - run: npx vitest run tests/durations.test.ts
